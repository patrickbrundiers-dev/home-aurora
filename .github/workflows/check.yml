name: Bundle-Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax beider Bundles
        run: |
          node --check dist/home-aurora.js
          node --check dist/home-aurora-wide.js
      - name: dist/ passt zu src/ (sonst node scripts/build.mjs ausführen)
        run: node scripts/build.mjs --check
